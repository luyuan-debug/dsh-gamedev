# Build and source tests. DSH, Godot and model-service tests run separately.
name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - name: Scan tracked source before installing dependencies
        run: python3 -B scripts/scan_publication.py . --tracked
      - name: Prepare the exact installer AST test dependency in a temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dsh-gamedev-setup-tests"
          setup_test_python="$RUNNER_TEMP/dsh-gamedev-setup-tests/bin/python"
          "$setup_test_python" -I -m pip --isolated install --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes -r locks/setup-test-requirements.lock
          "$setup_test_python" -I -c 'import yaml; assert yaml.__version__ == "6.0.3"'
          "$setup_test_python" -I -c 'import os, sys; f = open(os.environ["GITHUB_ENV"], "a", encoding="utf-8"); f.write("DSH_GAMEDEV_SETUP_TEST_PYTHON=" + sys.executable + "\n"); f.close()'
      - name: Install exact build tools outside source
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/dsh-gamedev-build"
          mkdir "$build_dir"
          cp locks/build-package-lock.json "$build_dir/package-lock.json"
          node --input-type=module - "$build_dir" <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const root = process.argv[2];
          const lock = JSON.parse(readFileSync(root + '/package-lock.json', 'utf8'));
          writeFileSync(root + '/package.json', JSON.stringify({
            name: lock.name, private: true, type: 'module',
            devDependencies: lock.packages[''].devDependencies,
          }, null, 2) + '\n');
          JS
          npm ci --prefix "$build_dir" --include=dev --cache "$build_dir/npm-cache"
          ln -s "$build_dir/node_modules" node_modules
      - name: Build and run portable Node tests
        run: |
          npm --cache "$RUNNER_TEMP/dsh-gamedev-build/npm-cache" run build
          npm --cache "$RUNNER_TEMP/dsh-gamedev-build/npm-cache" test
      - name: Run publication scanner regressions
        run: python3 -B -m unittest discover -s tests/publication -p 'test_*.py' -v
      - name: Run dependency-free guarded launcher checks
        run: python3 -B -m unittest discover -s tests/bridge -p 'test_guarded_main.py' -v
      - name: Check source and package structure
        run: python3 -B tests/contracts/check_contracts.py
